name: Check Not YAML Workflow
on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - "yamls/**"
    pull_request:
        branches:
            - master
        paths:
            - "yamls/**"

    
jobs:
    check-not-extension:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Check for other than yml|yaml extensions
              run: |
                echo $(ls -I '*.yaml' -I '*.yml' yamls/)
                if ls -I '*.yaml' -I '*.yml' yamls/ &> /dev/null; then
                  echo "::error::Error: Found Non YAML files."
                else
                  echo "No Non YAML files found."
                fi

            
