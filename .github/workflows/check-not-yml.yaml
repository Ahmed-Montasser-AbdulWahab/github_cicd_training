name: Check Not YAML Workflow
on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - "yamls/**"
    pull_request:
        branches:
            - master
        paths:
            - "yamls/**"
    repository_dispatch:
        types: [check-not-yaml]

    
jobs:
    check-not-extension:
        strategy:
            matrix:
                environment: [dev, staging, prod]
            fail-fast: false
            max-parallel: 3

        runs-on: ubuntu-latest
        steps:
            - name: Print Environment
              run: 'echo "Environment: ${{ matrix.environment }}"'

            - name: Checkout repository
              uses: actions/checkout@v7.0.1

            - name: Check for other than yml|yaml extensions
              run: |
                OUTPUT=$(find ./yamls -path './.git' -prune -o -type f ! -iname '*.yml' ! -iname '*.yaml' -print)
                echo $OUTPUT ${#OUTPUT}
                if [ -n "$OUTPUT" ]; then
                  echo "::error::Error: Found Non YAML files."
                else
                  echo "No Non YAML files found."
                fi

            - name: Print Called REST API if it was a repository_dispatch event
              if: github.event_name == 'repository_dispatch'
              run: |
                echo "Repository Dispatch Event Triggered"
                echo "REST API URL: ${{ github.api_url }}"

            
